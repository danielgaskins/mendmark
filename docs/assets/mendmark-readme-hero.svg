<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">How Mendmark tests agent evaluation suites</title>
  <desc id="desc">A passing case is changed with one controlled fault, existing evaluators run again, and the result identifies killed faults and surviving blind spots.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182d"/>
      <stop offset="0.55" stop-color="#17223b"/>
      <stop offset="1" stop-color="#112d36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="-35" r="190" fill="#38bdf8" opacity="0.06"/>
  <circle cx="100" cy="470" r="220" fill="#8b5cf6" opacity="0.08"/>
  <rect x="54" y="42" width="7" height="70" rx="3.5" fill="url(#accent)"/>
  <text x="82" y="72" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="750">Passing evals aren't proof.</text>
  <text x="82" y="105" fill="#b8c5d9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Change one thing. Run the same evaluators. Find the failures they still accept.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="155" width="246" height="164" rx="18" fill="#1e293b" stroke="#475569"/>
    <rect x="334" y="155" width="246" height="164" rx="18" fill="#211f3d" stroke="#8b5cf6"/>
    <rect x="614" y="155" width="246" height="164" rx="18" fill="#172b3a" stroke="#38bdf8"/>
    <rect x="894" y="155" width="252" height="164" rx="18" fill="#17312f" stroke="#34d399"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <circle cx="88" cy="190" r="15" fill="#334155"/>
    <text x="88" y="196" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">1</text>
    <text x="114" y="196" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1.2">PASSING CASE</text>
    <text x="78" y="237" fill="#cbd5e1" font-size="17">The agent case and</text>
    <text x="78" y="262" fill="#cbd5e1" font-size="17">its evals already pass.</text>
    <rect x="78" y="282" width="78" height="22" rx="11" fill="#163d35"/>
    <text x="117" y="298" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">PASS</text>

    <circle cx="368" cy="190" r="15" fill="#4c3b87"/>
    <text x="368" y="196" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="700">2</text>
    <text x="394" y="196" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1.2">PLANT ONE FAULT</text>
    <text x="358" y="237" fill="#ddd6fe" font-size="17">Argument · output · order</text>
    <text x="358" y="262" fill="#ddd6fe" font-size="17">side effect · response</text>
    <rect x="358" y="282" width="98" height="22" rx="11" fill="#3b2a68"/>
    <text x="407" y="298" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">MUTATE</text>

    <circle cx="648" cy="190" r="15" fill="#164e63"/>
    <text x="648" y="196" text-anchor="middle" fill="#cffafe" font-size="15" font-weight="700">3</text>
    <text x="674" y="196" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1.2">RERUN EVALS</text>
    <text x="638" y="237" fill="#bae6fd" font-size="17">Use the team's existing</text>
    <text x="638" y="262" fill="#bae6fd" font-size="17">metrics and policies.</text>
    <rect x="638" y="282" width="144" height="22" rx="11" fill="#123d4c"/>
    <text x="710" y="298" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">DEEPEVAL · JSON</text>

    <circle cx="928" cy="190" r="15" fill="#14532d"/>
    <text x="928" y="196" text-anchor="middle" fill="#dcfce7" font-size="15" font-weight="700">4</text>
    <text x="954" y="196" fill="#f8fafc" font-size="15" font-weight="700" letter-spacing="1.2">RELEASE SIGNAL</text>
    <text x="918" y="237" fill="#bbf7d0" font-size="17">Killed faults build confidence.</text>
    <text x="918" y="262" fill="#fecaca" font-size="17">Survivors expose blind spots.</text>
    <rect x="918" y="282" width="76" height="22" rx="11" fill="#163d35"/>
    <text x="956" y="298" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">KILLED</text>
    <rect x="1002" y="282" width="94" height="22" rx="11" fill="#4a2228"/>
    <text x="1049" y="298" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">SURVIVED</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M309 237h15m-6-6 6 6-6 6"/>
    <path d="M589 237h15m-6-6 6 6-6 6"/>
    <path d="M869 237h15m-6-6 6 6-6 6"/>
  </g>

  <rect x="54" y="357" width="1092" height="44" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="600" y="385" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">25 golden cases  ·  307 pinned mutations  ·  deterministic and offline</text>
</svg>

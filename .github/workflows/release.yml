name: release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install assurance dependencies
        run: python -m pip install --upgrade build pip-audit twine '.[deepeval,rubric,dev]'
      - name: Run product contracts
        run: python -m pytest
      - name: Verify golden sets
        run: |
          python benchmarks/benchmark_golden_set.py
          python benchmarks/benchmark_multi_agent_golden_set.py
          python benchmarks/benchmark_multi_agent_golden_set_v2.py
          python benchmarks/benchmark_outcome_golden_set.py
      - name: Enforce enterprise-scale resource budgets
        run: python benchmarks/benchmark_enterprise.py
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/assure_distribution.py dist/*.whl --project-root .
      - name: Audit the resolved product environment
        run: |
          python -m venv /tmp/mendmark-release-product
          /tmp/mendmark-release-product/bin/python -m pip install --upgrade pip setuptools
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_path"
          /tmp/mendmark-release-product/bin/python -m pip install "${wheel_path}[deepeval,rubric]"
          product_site=$(/tmp/mendmark-release-product/bin/python -c \
            'import site; print(site.getsitepackages()[0])')
          python -m pip_audit --path "$product_site"

  harness-assurance:
    name: harness-assurance (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: langgraph
            package: "langchain-core>=1,<2"
          - profile: crewai
            package: "crewai>=1,<2"
          - profile: openai-agents
            package: "openai-agents>=0.19,<1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' '${{ matrix.package }}'
      - name: Exercise current public harness objects
        env:
          MENDMARK_HARNESS: ${{ matrix.profile }}
        run: python -m pytest tests/test_harness_live_compatibility.py

  build:
    needs: [assurance, harness-assurance]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fetch annotated release tag
        if: github.event_name == 'release'
        run: >-
          git fetch --force --no-tags origin
          "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Verify signed release tag
        if: github.event_name == 'release'
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - id: package-version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mendmark-evals
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Wait for TestPyPI propagation and install
        run: |
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              mendmark-evals==${{ needs.build.outputs.version }}; then
              exit 0
            fi
            if (( attempt == 12 )); then
              exit 1
            fi
            sleep 10
          done
      - run: >-
          mendmark audit-json examples/order_agent_suite.json
          --evaluator-command "python examples/json_evaluator.py"
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-testpypi-report.json

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mendmark-evals
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  verify-pypi:
    if: github.event_name == 'release'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Wait for PyPI propagation and install
        run: |
          for attempt in {1..12}; do
            if python -m pip install --no-cache-dir --no-deps \
              mendmark-evals==${{ needs.build.outputs.version }}; then
              exit 0
            fi
            if (( attempt == 12 )); then
              exit 1
            fi
            sleep 10
          done
      - run: >-
          mendmark audit-json examples/order_agent_suite.json
          --evaluator-command "python examples/json_evaluator.py"
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-pypi-report.json

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  package-supply-chain:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel with supported integrations
        run: |
          python -m venv /tmp/mendmark-product
          /tmp/mendmark-product/bin/python -m pip install --upgrade pip setuptools
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_path"
          /tmp/mendmark-product/bin/python -m pip install "${wheel_path}[deepeval,rubric]"
      - name: Install isolated security tools
        run: |
          python -m venv /tmp/mendmark-security-tools
          /tmp/mendmark-security-tools/bin/python -m pip install \
            'pip-audit==2.9.0' 'cyclonedx-bom==7.3.0'
      - name: Audit the resolved integration environment
        run: |
          product_site=$(/tmp/mendmark-product/bin/python -c \
            'import site; print(site.getsitepackages()[0])')
          /tmp/mendmark-security-tools/bin/pip-audit --path "$product_site"
      - name: Generate and validate the CycloneDX SBOM
        run: |
          mkdir -p artifacts
          /tmp/mendmark-security-tools/bin/cyclonedx-py environment \
            /tmp/mendmark-product/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --sv 1.6 \
            --output-reproducible \
            --of JSON \
            -o artifacts/mendmark.cdx.json
          python -c 'import json; d=json.load(open("artifacts/mendmark.cdx.json")); assert d["bomFormat"] == "CycloneDX"; assert d["metadata"]["component"]["name"] == "mendmark-evals"'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mendmark-cyclonedx-sbom-${{ github.sha }}
          path: artifacts/mendmark.cdx.json
          if-no-files-found: error
          retention-days: 30

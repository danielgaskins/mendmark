name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Verify the Agent Eval Golden Set
        run: python benchmarks/benchmark_golden_set.py
      - name: Verify the Multi-Agent Golden Set
        run: python benchmarks/benchmark_multi_agent_golden_set.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[deepeval,rubric,dev]'
      - run: python -m pytest
      - name: Mutation-test the example agent evals
        run: >-
          mendmark audit examples/order_agent_suite.py
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-report.json
          --junit /tmp/mendmark-report.xml
          --sarif /tmp/mendmark-report.sarif
      - name: Mutation-test the framework-neutral JSON example
        run: >-
          mendmark audit-json examples/order_agent_suite.json
          --evaluator-command "python examples/json_evaluator.py"
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-json-report.json
      - name: Mutation-test the native multi-agent example
        run: >-
          mendmark audit-json examples/multi_agent_suite.json
          --evaluator-command "python examples/multi_agent_evaluator.py"
          --output /tmp/mendmark-multi-agent-report.json
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/mendmark-dist

  distribution-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Exercise the wheel outside the source checkout
        run: python scripts/assure_distribution.py dist/*.whl --project-root .

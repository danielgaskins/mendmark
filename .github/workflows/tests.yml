name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Verify the Agent Eval Golden Set
        run: python benchmarks/benchmark_golden_set.py
      - name: Verify the Multi-Agent Golden Set
        run: python benchmarks/benchmark_multi_agent_golden_set.py
      - name: Verify the Multi-Agent Golden Set v2
        run: python benchmarks/benchmark_multi_agent_golden_set_v2.py

  enterprise-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Enforce enterprise-scale resource budgets
        run: python benchmarks/benchmark_enterprise.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[deepeval,rubric,dev]'
      - run: python -m pytest
      - name: Mutation-test the example agent evals
        run: >-
          mendmark audit examples/order_agent_suite.py
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-report.json
          --junit /tmp/mendmark-report.xml
          --sarif /tmp/mendmark-report.sarif
      - name: Mutation-test the framework-neutral JSON example
        run: >-
          mendmark audit-json examples/order_agent_suite.json
          --evaluator-command "python examples/json_evaluator.py"
          --baseline examples/order_agent_baseline.json
          --output /tmp/mendmark-json-report.json
      - name: Mutation-test the native multi-agent example
        run: >-
          mendmark audit-json examples/multi_agent_suite.json
          --evaluator-command "python examples/multi_agent_evaluator.py"
          --output /tmp/mendmark-multi-agent-report.json
      - name: Build the wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/mendmark-dist

  integration-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependency-profile: [minimum, latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install minimum supported integrations
        if: matrix.dependency-profile == 'minimum'
        run: python -m pip install -e '.[dev]' 'deepeval==4.0.0' 'rubric-eval==0.2.0'
      - name: Install latest supported integrations
        if: matrix.dependency-profile == 'latest'
        run: python -m pip install -e '.[deepeval,rubric,dev]'
      - run: python -m pytest tests/test_deepeval.py tests/test_rubric_example.py

  harness-compatibility:
    name: harness-compatibility (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: langgraph
            package: "langchain-core>=1,<2"
          - profile: crewai
            package: "crewai>=1,<2"
          - profile: openai-agents
            package: "openai-agents>=0.19,<1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' '${{ matrix.package }}'
      - name: Exercise current public harness objects
        env:
          MENDMARK_HARNESS: ${{ matrix.profile }}
        run: python -m pytest tests/test_harness_live_compatibility.py

  distribution-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Exercise the wheel outside the source checkout
        run: python scripts/assure_distribution.py dist/*.whl --project-root .
